name: CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aquarium
          POSTGRES_PASSWORD: aquarium
          POSTGRES_DB: aquarium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquarium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aquarium:aquarium@localhost:5432/aquarium_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run --if-present assets:check

  e2e-shard:
    name: e2e shard ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'chore/batch-') || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # part is index/count over the describe's tests; raise count when a describe's shards pass ~10 min.
        include:
          - name: menus-phone-1
            args: menus.spec
            describe: menus on a phone
            part: 1/4
          - name: menus-phone-2
            args: menus.spec
            describe: menus on a phone
            part: 2/4
          - name: menus-phone-3
            args: menus.spec
            describe: menus on a phone
            part: 3/4
          - name: menus-phone-4
            args: menus.spec
            describe: menus on a phone
            part: 4/4
          - name: menus-mouse-1
            args: menus.spec
            describe: menus with a mouse
            part: 1/2
          - name: menus-mouse-2
            args: menus.spec
            describe: menus with a mouse
            part: 2/2
          - name: decor-death
            args: decor.spec death.spec
          - name: switch-tanks-feed
            args: tank-type-switch.spec tanks.spec feed.spec ktx2.spec
          - name: care-auth-reset
            args: care.spec auth.spec password-reset.spec password-reset-history.spec
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aquarium
          POSTGRES_PASSWORD: aquarium
          POSTGRES_DB: aquarium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquarium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aquarium:aquarium@localhost:5432/aquarium_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pick this shard's slice of the describe
        if: ${{ matrix.part != '' }}
        env:
          PART: ${{ matrix.part }}
          DESCRIBE: ${{ matrix.describe }}
          SPEC: ${{ matrix.args }}
        run: |
          grep=$(node .github/scripts/e2e-slice.mjs "$PART" "$DESCRIBE" $SPEC)
          echo "E2E_GREP=$grep" >> "$GITHUB_ENV"
      - name: Record which tests this shard selects
        env:
          SPEC: ${{ matrix.args }}
        run: |
          mkdir shard-tests
          grep_args=()
          if [ -n "$E2E_GREP" ]; then grep_args=("--grep=$E2E_GREP"); fi
          pnpm exec playwright test -c e2e/playwright.config.ts --list --reporter=list $SPEC "${grep_args[@]}" \
            | grep -E '^\s+\S+\.spec\.ts:[0-9]+:[0-9]+ › ' | sed -E 's/^\s+//' > shard-tests/${{ matrix.name }}.txt
          test -s shard-tests/${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-${{ matrix.name }}
          path: shard-tests
          retention-days: 1
      - name: Run this shard
        env:
          SPEC: ${{ matrix.args }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/blob-report
        run: |
          grep_args=()
          if [ -n "$E2E_GREP" ]; then grep_args=("--grep=$E2E_GREP"); fi
          pnpm run e2e $SPEC "${grep_args[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.name }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'chore/batch-') || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-blob-*
          path: all-blobs
          merge-multiple: true
      - if: hashFiles('all-blobs/**') == ''
        run: echo "::warning::No e2e blob reports were downloaded; the HTML report was not produced."
      - if: hashFiles('all-blobs/**') != ''
        continue-on-error: true
        run: pnpm exec playwright merge-reports --reporter html all-blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'chore/batch-') || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
    timeout-minutes: 5
    steps:
      - name: All e2e shards passed
        run: test "${{ needs.e2e-shard.result }}" = success
      - uses: actions/checkout@v4
      - name: Every spec file is named in a shard's args
        run: |
          for f in e2e/*.spec.ts e2e/tests/*.spec.ts; do
            grep -Eq "^\s+args: (.* )?$(basename "$f" .ts)( |$)" .github/workflows/ci.yml || { echo "::error::$f is in no e2e shard; add it to the matrix in ci.yml"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        id: counts-1
        continue-on-error: true
        with:
          pattern: e2e-tests-*
          path: shard-tests
          merge-multiple: true
      - if: ${{ steps.counts-1.outcome == 'failure' }}
        run: sleep 15
      - uses: actions/download-artifact@v4
        id: counts-2
        if: ${{ steps.counts-1.outcome == 'failure' }}
        continue-on-error: true
        with:
          pattern: e2e-tests-*
          path: shard-tests
          merge-multiple: true
      - if: ${{ steps.counts-1.outcome == 'failure' && steps.counts-2.outcome == 'failure' }}
        run: sleep 30
      - uses: actions/download-artifact@v4
        if: ${{ steps.counts-1.outcome == 'failure' && steps.counts-2.outcome == 'failure' }}
        with:
          pattern: e2e-tests-*
          path: shard-tests
          merge-multiple: true
      - name: Every test runs in exactly one shard
        run: |
          pnpm exec playwright test -c e2e/playwright.config.ts --list --reporter=list \
            | grep -E '^\s+\S+\.spec\.ts:[0-9]+:[0-9]+ › ' | sed -E 's/^\s+//' | sort > all-tests.txt
          cat shard-tests/*.txt | sort > selected-tests.txt
          echo "listed=$(wc -l < all-tests.txt) selected=$(wc -l < selected-tests.txt)"
          test -s all-tests.txt
          diff all-tests.txt selected-tests.txt || { echo "::error::shards must select every e2e test exactly once; fix the matrix in ci.yml"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aquarium:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container turns healthy and serves noindex
        run: |
          docker network create aqnet
          docker run -d --name aqdb --network aqnet \
            -e POSTGRES_USER=aquarium -e POSTGRES_PASSWORD=aquarium -e POSTGRES_DB=aquarium \
            --health-cmd "pg_isready -U aquarium" --health-interval 2s --health-retries 30 postgres:17
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' aqdb)" = healthy ] && break
            sleep 2
          done
          docker run -d --name aq --network aqnet -p 3000:3000 \
            -e SITE_INDEXABLE=false \
            -e DATABASE_URL=postgres://aquarium:aquarium@aqdb:5432/aquarium \
            -e BETTER_AUTH_SECRET=ciSecretciSecretciSecretciSecretciSecret0123 \
            -e APP_URL=https://ci.example.test \
            aquarium:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' aq)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' aq | grep -qx healthy || { docker logs aq; exit 1; }
          for path in / /api/health; do
            curl -fsS -D headers.txt -o /dev/null "http://127.0.0.1:3000$path"
            grep -i '^x-robots-tag: noindex, nofollow' headers.txt
            grep -i "^content-security-policy: .*script-src 'self' 'wasm-unsafe-eval'" headers.txt
            grep -i '^strict-transport-security: max-age=31536000' headers.txt
            grep -i '^x-content-type-options: nosniff' headers.txt
            grep -i '^referrer-policy: ' headers.txt
          done
          curl -fsS http://127.0.0.1:3000/robots.txt | grep -x 'Disallow: /'
