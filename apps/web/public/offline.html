<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>The tank is asleep - Aquarium</title>
    <link rel="icon" href="/icons/icon-96.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #dbe8f0;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22%;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #a9bcc8;
      }
      a {
        margin-top: 0.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        background: #ffb36b;
        color: #1a1208;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>The tank is asleep</h1>
      <p>
        You are offline, so the fish are resting. Your tank keeps living on the server. Reconnect
        and it will wake up.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
